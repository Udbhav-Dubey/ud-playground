<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Courier New", monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
        }

        .company-logo {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .company-logo:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }
        .company-logo img {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            display: block;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 3px solid #444;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .title {
            font-size: 3em;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .controls {
            font-size: 0.85em;
            color: #bbb;
            margin-bottom: 15px;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            flex-wrap: wrap;
            gap: 15px;
        }

        .score {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.3em;
        }

        .high-score {
            color: #ffc107;
            font-weight: bold;
        }

        .connection-status {
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .connected {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .disconnected {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(20, 25px);
            grid-template-rows: repeat(20, 25px);
            gap: 1px;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 10px;
            border: 3px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .cell {
            width: 25px;
            height: 25px;
            background: #1a1a1a;
            border-radius: 2px;
            transition: all 0.1s ease;
        }

        .snake-head {
            background: radial-gradient(circle, #00ff88, #00cc66);
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 1s ease-in-out infinite;
        }

        .snake-body {
            background: linear-gradient(135deg, #00cc66, #009944);
            border-radius: 20%;
        }

        .food {
            background: radial-gradient(circle, #ff4444, #cc2222);
            border-radius: 50%;
            animation: foodPulse 0.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes foodPulse {
            0%, 100% {
                box-shadow: 0 0 5px #ff4444;
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 15px #ff4444, 0 0 25px #ff4444;
                transform: scale(1.15);
            }
        }

        .game-over, .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .game-over h2 {
            color: #ff4444;
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 0 0 40px #ff4444;
            animation: gameOverPulse 2s ease-in-out infinite;
        }

        .start-screen h2 {
            color: #00ff88;
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 0 0 40px #00ff88;
        }

        @keyframes gameOverPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .game-message {
            font-size: 1.2em;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(45deg, #00ff88, #00ccff);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 200, 150, 0.3);
        }

        .hidden {
            display: none;
        }

        .leaderboard-table {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-collapse: collapse;
            text-align: center;
        }

        .leaderboard-table th,
        .leaderboard-table td {
            padding: 10px;
            border: 1px solid #444;
        }

        .leaderboard-table th {
            background: #00ccff;
            color: #000;
            font-weight: bold;
        }

        .leaderboard-table tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.05);
        }

        .name-input {
            padding: 12px 20px;
            font-size: 1.1em;
            border-radius: 8px;
            border: 2px solid #00ccff;
            background: #222;
            color: #fff;
            margin: 20px 0;
            width: 300px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(20, 20px);
                grid-template-rows: repeat(20, 20px);
            }
            .cell {
                width: 20px;
                height: 20px;
            }
            .company-logo img {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="company-logo">
        <a href="https://gdsc.community.dev/thapar-institute-of-engineering-and-technology-patiala/" target="_blank">
            <img src="https://media.licdn.com/dms/image/v2/C4E0BAQHmBJiYrz26ig/company-logo_200_200/company-logo_200_200/0/1630573316047/developer_student_club_thapar_logo?e=2147483647&v=beta&t=_vl0uDMUU5Sz9dmzMhau29KKGLBdIRFw9JHXpsp843Y"
                 alt="GDSC Thapar" title="GDSC Thapar" />
        </a>
    </div>

    <div class="start-screen" id="startScreen">
        <h2>🐍 SNAKE GAME</h2>
        <div class="game-message">
            Use Arrow Keys or WASD to control the snake<br>
            Eat food to grow and score points!
        </div>
        <div class="leaderboard-container" id="leaderboardContainer"></div>
        <input type="text" id="playerNameInput" class="name-input" placeholder="Enter your name..." maxlength="15" />
        <button class="btn" onclick="startGame()">Start Game</button>
    </div>

    <div class="game-container hidden" id="gameContainer">
        <div class="header">
            <h1 class="title">SNAKE</h1>
            <div class="subtitle">Classic Snake Game 🐍</div>
        </div>
        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="high-score">High Score: <span id="highScore">0</span></div>
            <div class="connection-status disconnected" id="connectionStatus">Disconnected</div>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <div class="game-over hidden" id="gameOver">
        <h2>GAME OVER!</h2>
        <p class="game-message" id="gameOverMessage">
            Your snake got too ambitious!<br>
            Final Score: <span id="finalScore">0</span>
        </p>
        <button class="btn" onclick="showStartScreen()">Play Again</button>
    </div>

    <script>
        const API_BASE = "http://localhost:8080";
        let gameState = null;
        let connected = false;
        let updateInterval = null;

        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let i = 0; i < 400; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                grid.appendChild(cell);
            }
        }

        function showStartScreen() {
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('gameContainer').classList.add('hidden');
            document.getElementById('gameOver').classList.add('hidden');
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
            fetchLeaderboard();
        }

        async function startGame() {
            const playerName = document.getElementById('playerNameInput').value.trim();
            if (!playerName) {
                alert('Please enter your name!');
                return;
            }

            try {
                gameState = await makeRequest('/newgame', {
                    method: 'POST',
                    body: JSON.stringify({ name: playerName })
                });

                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameContainer').classList.remove('hidden');
                
                createGrid();
                renderGame();
                
                if (updateInterval) clearInterval(updateInterval);
                updateInterval = setInterval(updateGameState, 200);
                
            } catch (error) {
                console.error('Failed to start game:', error);
                alert('Failed to connect to server!');
            }
        }

        async function updateGameState() {
            try {
                gameState = await makeRequest('/state');
                renderGame();
                
                if (!gameState.gameActive) {
                    clearInterval(updateInterval);
                    updateInterval = null;
                    showGameOver();
                }
            } catch (error) {
                console.error('Failed to update game:', error);
            }
        }

        async function makeRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                connected = true;
                updateConnectionStatus();
                return await response.json();
            } catch (error) {
                console.error('Request failed:', error);
                connected = false;
                updateConnectionStatus();
                throw error;
            }
        }

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (connected) {
                statusEl.textContent = 'Connected';
                statusEl.className = 'connection-status connected';
            } else {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'connection-status disconnected';
            }
        }

        function renderGame() {
            if (!gameState) return;

            document.getElementById('score').textContent = gameState.score;
            document.getElementById('highScore').textContent = gameState.highScore;

            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.className = 'cell';
            });

            // Render snake body
            gameState.snake.forEach((segment, index) => {
                const cellIndex = segment.y * 20 + segment.x;
                const cell = cells[cellIndex];
                if (cell) {
                    cell.className = index === 0 ? 'cell snake-head' : 'cell snake-body';
                }
            });

            // Render food
            if (gameState.food) {
                const foodIndex = gameState.food.y * 20 + gameState.food.x;
                const foodCell = cells[foodIndex];
                if (foodCell) {
                    foodCell.className = 'cell food';
                }
            }
        }

        function showGameOver() {
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('gameOver').classList.remove('hidden');
        }

        async function fetchLeaderboard() {
            try {
                const leaderboard = await makeRequest('/leaderboard');
                const container = document.getElementById('leaderboardContainer');
                
                if (leaderboard.length === 0) {
                    container.innerHTML = '<p style="color: #888; margin: 20px 0;">No high scores yet. Be the first!</p>';
                    return;
                }

                let html = '<table class="leaderboard-table"><tr><th>Rank</th><th>Player</th><th>Score</th></tr>';
                leaderboard.forEach((entry, index) => {
                    html += `<tr><td>${index + 1}</td><td>${entry.name}</td><td>${entry.score}</td></tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
            } catch (error) {
                console.error('Failed to fetch leaderboard:', error);
            }
        }

        async function sendDirection(direction) {
            if (!gameState || !gameState.gameActive) return;
            
            try {
                await makeRequest('/move', {
                    method: 'POST',
                    body: JSON.stringify({ direction })
                });
            } catch (error) {
                console.error('Failed to send direction:', error);
            }
        }

        function handleKeyPress(event) {
            if (!gameState || !gameState.gameActive) return;

            const key = event.key.toLowerCase();
            let direction = null;

            if (key === 'arrowup' || key === 'w') direction = 'up';
            else if (key === 'arrowdown' || key === 's') direction = 'down';
            else if (key === 'arrowleft' || key === 'a') direction = 'left';
            else if (key === 'arrowright' || key === 'd') direction = 'right';

            if (direction) {
                event.preventDefault();
                sendDirection(direction);
            }
        }

        document.addEventListener('keydown', handleKeyPress);
        document.addEventListener('DOMContentLoaded', () => {
            showStartScreen();
        });
    </script>
</body>
</html>
